<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Animated Grand Line map of AI project islands"><defs><style>@keyframes sail{0%{transform:translateX(0)}50%{transform:translateX(110px)}100%{transform:translateX(0)}}@keyframes pulse{50%{opacity:.4}}.boat{animation:sail 9s ease-in-out infinite}.route{stroke-dasharray:10 12;animation:pulse 2s infinite}</style></defs><rect width="1000" height="300" rx="24" fill="#f1ddb1"/><rect x="15" y="15" width="970" height="270" rx="14" fill="none" stroke="#9c7341" stroke-width="3"/><g fill="#9b7946" opacity=".25"><circle cx="80" cy="50" r="40"/><circle cx="910" cy="250" r="60"/></g><path class="route" d="M120 155 Q280 50 385 145 T660 145 T875 130" fill="none" stroke="#8a5430" stroke-width="5"/><g fill="#3f795f" stroke="#5c472a" stroke-width="4"><ellipse cx="130" cy="155" rx="76" ry="39"/><ellipse cx="390" cy="145" rx="83" ry="41"/><ellipse cx="650" cy="145" rx="79" ry="43"/><ellipse cx="870" cy="130" rx="80" ry="39"/></g><g fill="#3e2c1b" font-family="Georgia,serif" font-size="20" text-anchor="middle" font-weight="bold"><text x="130" y="220">VOICE AI</text><text x="390" y="213">RAG ISLAND</text><text x="650" y="215">AGENT FLEET</text><text x="870" y="202">GREEN AI</text></g><g class="boat"><path d="M220 108h65l-12 15h-40Z" fill="#7e4b2b"/><path d="M250 108V57l28 47Z" fill="#fff7dc"/><path d="M247 108V65l-23 39Z" fill="#fff7dc"/></g><text x="500" y="48" font-size="25" text-anchor="middle" fill="#5a3c20" font-family="Georgia,serif" font-weight="bold">THE PROJECT ARCHIPELAGO</text><text x="500" y="265" font-size="16" text-anchor="middle" fill="#654c2b" font-family="Georgia,serif">Every repository is another island on the Grand Line</text></svg>