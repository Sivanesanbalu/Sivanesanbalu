<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Animated glowing power-up AI engineer title"><defs><style>@keyframes pulse{50%{opacity:.35;transform:scale(1.03)}}@keyframes dash{to{stroke-dashoffset:-80}}.aura{animation:pulse 2.8s ease-in-out infinite;transform-origin:450px 80px}.ring{stroke-dasharray:20 20;animation:dash 4s linear infinite}</style></defs><rect width="900" height="160" rx="22" fill="#101c35"/><ellipse class="aura" cx="450" cy="80" rx="390" ry="63" fill="#7a7cf0" opacity=".2"/><ellipse class="ring" cx="450" cy="80" rx="410" ry="68" fill="none" stroke="#f4dc94" stroke-width="3"/><text x="450" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#fff2d1">AWAKENED: AI ENGINEER</text><text x="450" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b3e8ef">IMAGINATION → RESEARCH → PRODUCTION</text></svg>