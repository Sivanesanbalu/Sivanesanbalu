 <!-- story text -->
 <line x1="726" y1="85" x2="1392" y2="85" stroke="#ee9348" stroke-opacity=".6"/>
 <text x="730" y="58" fill="#f9a444" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">THE NINJA WAY  /  CODE CHRONICLES</text>
 <text x="722" y="170" fill="#fff7e8" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="2">SIVANESAN B</text>
 <text x="725" y="227" fill="#a7d9ee" font-family="Arial,sans-serif" font-size="29" font-weight="700">AI Engineer  ·  GenAI  ·  RAG  ·  Voice AI</text>
 <path d="M730 265H1320" stroke="#53677a" stroke-width="1"/>
 <text x="728" y="318" fill="#fff2e3" font-family="Arial,sans-serif" font-size="27" font-weight="700">MY NINJA WAY: BUILD. LEARN. EVOLVE.</text>
 <text x="728" y="360" fill="#d2dae9" font-family="Arial,sans-serif" font-size="22">Every project is a new mission.</text>
 <text x="728" y="392" fill="#d2dae9" font-family="Arial,sans-serif" font-size="22">Every bug is another training arc.</text>
 <rect x="726" y="438" rx="19" width="263" height="49" fill="#e9771e"/>
 <text x="753" y="470" fill="#111422" font-family="Arial,sans-serif" font-size="19" font-weight="800">MISSION: SHIP REAL AI</text>
 <rect x="1005" y="438" rx="19" width="310" height="49" fill="none" stroke="#70d5f7" stroke-width="2"/>
 <text x="1035" y="470" fill="#a1e6ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">RANK: ALWAYS LEARNING</text>
 <path d="M700 523H1394" stroke="#47586b" stroke-width="1"/>
 <text x="728" y="547" fill="#809caf" font-family="Arial,sans-serif" font-size="14">Naruto fan tribute • Personal developer profile • Unofficial artwork</text>
