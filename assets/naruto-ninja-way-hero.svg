<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Sivanesan B — Naruto-inspired AI Ninja Way</title>
<desc id="desc">Anime illustration of a blond ninja in an orange jacket, surrounded by blue chakra energy, with a chapter-style AI engineering profile introduction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".58" stop-color="#11192d"/><stop offset="1" stop-color="#291425"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#62e5ff" stop-opacity=".7"/><stop offset=".48" stop-color="#3085c5" stop-opacity=".23"/><stop offset="1" stop-color="#36b6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="jacket" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffb12a"/><stop offset=".55" stop-color="#f37516"/><stop offset="1" stop-color="#aa451b"/></linearGradient>
  <linearGradient id="steel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f0f6fc"/><stop offset=".45" stop-color="#95a7b5"/><stop offset="1" stop-color="#4b5869"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a5c2f6" opacity=".13"/></pattern>
  <clipPath id="round"><rect width="1440" height="560" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
