  <animateTransform attributeName="transform" type="rotate" from="0 360 263" to="360 360 263" dur="32s" repeatCount="indefinite"/>
 </circle>
 <circle cx="360" cy="263" r="228" fill="none" stroke="#ffad38" stroke-width="1.5" stroke-dasharray="2 22" opacity=".34">
  <animateTransform attributeName="transform" type="rotate" from="360 360 263" to="0 360 263" dur="45s" repeatCount="indefinite"/>
 </circle>
