<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img" aria-label="Original animated green-haired swordsman with triple blades, inspired by One Piece"><title>Original animated green-haired swordsman with triple blades, inspired by One Piece</title>
<defs>
<linearGradient id="skin" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f7d0aa"/><stop offset=".55" stop-color="#df976b"/><stop offset="1" stop-color="#a65c47"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e45a45"/><stop offset=".6" stop-color="#b62e39"/><stop offset="1" stop-color="#581c36"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344557"/><stop offset=".7" stop-color="#0e1e31"/><stop offset="1" stop-color="#050d1c"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff2c4"/><stop offset=".5" stop-color="#e6ba6c"/><stop offset="1" stop-color="#a97444"/></linearGradient>
<filter id="aura"><feGaussianBlur stdDeviation="10"/></filter>
</defs><style>
@keyframes idle{0%,100%{transform:translateY(0px) rotate(-.5deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes hat{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes arm{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
@keyframes sparkle{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.9;transform:translateY(-20px)}}
@keyframes wind{to{stroke-dashoffset:-120}}
@keyframes glow{50%{opacity:.28}}
.char{animation:idle 5.5s ease-in-out infinite;transform-origin:210px 500px}.hat{animation:hat 6s ease-in-out infinite;transform-origin:210px 190px}
.arm{animation:arm 3s ease-in-out infinite;transform-origin:128px 350px}
.spark{animation:sparkle 3.2s ease-in-out infinite}.wind{stroke-dasharray:22 18;animation:wind 4s linear infinite}
.blade{animation:bladePulse 3.5s ease-in-out infinite;transform-origin:200px 300px}@keyframes bladePulse{50%{filter:drop-shadow(0 0 9px #95f8d9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<ellipse cx="203" cy="619" rx="144" ry="24" fill="#010e1a" opacity=".35"/>
<ellipse cx="208" cy="335" rx="155" ry="255" fill="#50ae8b" opacity=".16" filter="url(#aura)"/>
