</g>
<!-- neck and face -->
<path d="M176 296h57l12 48q-29 27-67 2z" fill="url(#skin)"/>
<ellipse cx="209" cy="229" rx="75" ry="94" fill="url(#skin)"/>
<path d="M143 224q-30-31-13-56 15-22 43-20l28-22 22 15q38-9 58 33l-5 54-22-34-24 9-27-25-26 32-22-5z" fill="#191c2a"/>
<path d="M165 225l-22 32 27-10m88-28 22 33-31-10" fill="#161d2b" stroke-width="7"/>
<path d="M167 236q12-9 26 0M226 237q12-9 24 0" stroke="#2f1e26" fill="none"/>
