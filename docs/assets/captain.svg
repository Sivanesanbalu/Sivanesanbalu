<path d="M147 156q-9-78 61-95 72 6 68 95-64 28-129 0z" fill="#e6bd72"/>
<path d="M146 130q70 17 132-1l1 28q-65 18-136-1z" fill="#b4423d" stroke-width="4"/>
<path d="M98 158q110 31 226-5" fill="none" stroke="#a57448" stroke-width="3"/>
<path d="M165 88q34-19 83 5" fill="none" stroke="#fff2bd" stroke-width="5" opacity=".6"/></g>
</g>
<g fill="#ffe7a9" class="spark"><circle cx="46" cy="120" r="5"/><circle cx="334" cy="278" r="4"/><path d="M350 118v20m-10-10h20" stroke="#ffe7a9" stroke-width="3"/></g>
</svg>