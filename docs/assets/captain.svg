<path d="M189 282q20 15 44-2" fill="none" stroke="#863d35" stroke-width="5"/>
<path d="M178 211l21-6m27 5 23 6" fill="none" stroke="#31252a" stroke-width="5"/>
<!-- iconic broad woven straw hat -->
