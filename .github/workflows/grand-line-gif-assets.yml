name: Render Grand Line GIF Banner and Crew

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grand-line-gif-assets.yml"
      - "scripts/render_profile_gifs.py"
      - "docs/assets/luffy-film-z.webp"

permissions:
  contents: write

concurrency:
  group: grand-line-gif-assets
  cancel-in-progress: false

jobs:
  create-gifs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image renderer
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Generate animated banner and transparent crew cutouts
        run: python scripts/render_profile_gifs.py
      - name: Confirm assets are valid animated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets=Path('assets/profile')
          for path in sorted(assets.glob('*.gif')):
              gif=Image.open(path)
              if gif.n_frames<2: raise SystemExit(f'Not animated: {path}')
              print(f'{path}: {gif.size}, {gif.n_frames} frames, {path.stat().st_size:,} bytes')
          if not (assets/'grand-line-banner.gif').exists(): raise SystemExit('Banner was not generated')
          PY
      - name: Commit generated GIF images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.gif
          if ! git diff --cached --quiet; then
              git commit -m "assets: publish generated animated Grand Line GIF banner and character cutouts"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
          else
              echo "GIF assets already up to date"
          fi
