name: Generate Profile 3D & Animations

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Graphs and Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Isometric Contribution Graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Contribution Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Bundle Animation Assets
        run: |
          sudo chown -R $USER:$USER .
          mkdir -p dist
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* dist/
          fi
          echo "Generated assets in dist:"
          ls -la dist/

      - name: Deploy Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
